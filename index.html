<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>64th SETA Convention • Coffee Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system_ui, sans-serif; }
    .heading-font { font-family: 'Playfair Display', Georgia, serif; }
    .slot-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .slot-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05); }
    .nav-active { background-color: #0f172a; color: white; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50">
  <div class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-6 py-8">
      <div class="flex items-center justify-between">
        <div>
          <div class="flex items-center gap-x-3">
            <div class="w-11 h-11 bg-teal-500 rounded-2xl flex items-center justify-center">
              <i class="fa-solid fa-mug-hot text-white text-3xl"></i>
            </div>
            <div>
              <h1 class="heading-font text-4xl font-bold tracking-tighter">64th SETA Convention</h1>
              <p class="text-slate-400 text-lg">Coffee Service Volunteer Sign-Up</p>
            </div>
          </div>
        </div>
        <div class="hidden md:block text-right">
          <div class="text-sm text-slate-400">February 6–8, 2026</div>
          <div class="font-semibold">Serving with excellence</div>
        </div>
      </div>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-6 py-10">
    <div class="mb-8 max-w-2xl">
      <p class="text-slate-600 text-lg">Thank you for volunteering! Please sign up for the time slots you'd like to serve coffee. Each slot needs <span class="font-semibold">2 volunteers</span>.</p>
    </div>

    <div class="flex gap-2 mb-8">
      <button onclick="switchDay('friday')" id="tab-friday" class="px-6 py-3 font-semibold text-lg flex items-center gap-x-2 nav-active">
        <i class="fa-solid fa-calendar-day"></i><span>Friday</span>
      </button>
      <button onclick="switchDay('saturday')" id="tab-saturday" class="px-6 py-3 font-semibold text-lg flex items-center gap-x-2 text-slate-700 hover:bg-slate-100 rounded-full transition-colors">
        <i class="fa-solid fa-calendar-day"></i><span>Saturday</span>
      </button>
      <button onclick="switchDay('sunday')" id="tab-sunday" class="px-6 py-3 font-semibold text-lg flex items-center gap-x-2 text-slate-700 hover:bg-slate-100 rounded-full transition-colors">
        <i class="fa-solid fa-calendar-day"></i><span>Sunday</span>
      </button>
    </div>

    <div id="day-friday"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="slots-friday"></div></div>
    <div id="day-saturday" class="hidden"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="slots-saturday"></div></div>
    <div id="day-sunday" class="hidden"><div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="slots-sunday"></div></div>

    <div class="mt-10 text-center text-sm text-slate-500">
      Questions? Contact the convention team • <span class="font-medium">seta@convention.org</span>
    </div>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl w-full max-w-md mx-4 p-8">
      <div class="flex justify-between items-start mb-6">
        <div>
          <div class="font-semibold text-xl" id="modal-time"></div>
          <div class="text-slate-500" id="modal-day"></div>
        </div>
        <button onclick="closeModal()" class="text-3xl leading-none text-slate-400 hover:text-slate-600">&times;</button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
          <input type="text" id="name-input" class="w-full px-4 py-3 border border-slate-300 rounded-2xl" placeholder="Jane Doe">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Email (optional)</label>
          <input type="email" id="email-input" class="w-full px-4 py-3 border border-slate-300 rounded-2xl" placeholder="jane@email.com">
        </div>
      </div>
      <div class="mt-8 flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-3.5 rounded-2xl border border-slate-300 font-semibold hover:bg-slate-50">Cancel</button>
        <button onclick="submitSignup()" class="flex-1 py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-semibold">Sign Me Up</button>
      </div>
    </div>
  </div>

  <script>
    const slotsData = {
      friday: ["7:30–9:00","9:00–10:00","10:00–11:00","11:00–12:00","12:00–1:00","1:00–2:00","2:00–3:00","3:00–4:00","4:00–5:00","5:00–6:00","6:00–7:00","7:00–8:00"],
      saturday: ["7:30–9:00","9:00–10:00","10:00–11:00","11:00–12:00","12:00–1:00","1:00–2:00","2:00–3:00","3:00–4:00","4:00–5:00","5:00–6:00","6:00–7:00","7:00–8:00"],
      sunday: ["7:30–9:00","9:00–10:00"]
    };
    let signups = JSON.parse(localStorage.getItem('setaCoffeeSignups') || '{}');

    function renderSlots(day) {
      const container = document.getElementById(`slots-${day}`);
      container.innerHTML = '';
      slotsData[day].forEach(time => {
        const key = `${day}-${time}`;
        const volunteers = signups[key] || [];
        const div = document.createElement('div');
        div.className = `slot-card bg-white border border-slate-200 rounded-3xl p-6 flex flex-col`;
        let html = `
          <div class="flex justify-between items-start mb-4">
            <div>
              <div class="font-semibold text-xl tracking-tight">${time}</div>
              <div class="text-xs text-slate-500 mt-0.5">Coffee Service</div>
            </div>
            <div class="text-xs px-3 py-1 rounded-full ${volunteers.length >= 2 ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}">${volunteers.length}/2</div>
          </div>
          <div class="flex-1 min-h-[72px]">`;
        if (volunteers.length > 0) {
          html += `<div class="space-y-1">`;
          volunteers.forEach(v => { html += `<div class="text-sm px-3 py-1.5 bg-slate-100 rounded-2xl flex items-center gap-2"><i class="fa-solid fa-user text-teal-600 w-4"></i> <span class="font-medium">${v.name}</span></div>`; });
          html += `</div>`;
        } else {
          html += `<div class="text-sm text-slate-400 italic">No volunteers yet</div>`;
        }
        html += `</div>`;
        if (volunteers.length < 2) {
          html += `<button onclick="openModal('${day}', '${time}')" class="mt-5 w-full py-3 text-sm font-semibold rounded-2xl border border-teal-600 text-teal-700 hover:bg-teal-50"><i class="fa-solid fa-plus mr-2"></i> Sign up for this slot</button>`;
        } else {
          html += `<div class="mt-5 text-center text-xs font-medium text-emerald-600">Slot full • Thank you!</div>`;
        }
        div.innerHTML = html;
        container.appendChild(div);
      });
    }

    function switchDay(day) {
      document.getElementById('day-friday').classList.add('hidden');
      document.getElementById('day-saturday').classList.add('hidden');
      document.getElementById('day-sunday').classList.add('hidden');
      document.getElementById(`day-${day}`).classList.remove('hidden');
      ['friday','saturday','sunday'].forEach(d => {
        const tab = document.getElementById(`tab-${d}`);
        if (d === day) { tab.classList.add('nav-active'); tab.classList.remove('text-slate-700','hover:bg-slate-100'); }
        else { tab.classList.remove('nav-active'); tab.classList.add('text-slate-700','hover:bg-slate-100'); }
      });
    }

    let currentDay = '', currentTime = '';

    function openModal(day, time) {
      currentDay = day; currentTime = time;
      document.getElementById('modal-time').innerText = time;
      document.getElementById('modal-day').innerText = day.charAt(0).toUpperCase() + day.slice(1);
      document.getElementById('name-input').value = '';
      document.getElementById('email-input').value = '';
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('name-input').focus();
    }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    function submitSignup() {
      const name = document.getElementById('name-input').value.trim();
      if (!name) { alert("Please enter your name"); return; }
      const key = `${currentDay}-${currentTime}`;
      if (!signups[key]) signups[key] = [];
      if (signups[key].length >= 2) { alert("This slot is already full."); closeModal(); return; }
      signups[key].push({ name: name, email: document.getElementById('email-input').value.trim() });
      localStorage.setItem('setaCoffeeSignups', JSON.stringify(signups));
      closeModal();
      renderSlots(currentDay);
    }

    function init() {
      renderSlots('friday'); renderSlots('saturday'); renderSlots('sunday');
      document.getElementById('day-friday').classList.remove('hidden');
      document.getElementById('tab-friday').classList.add('nav-active');
    }
    window.onload = init;
  </script>
</body>
</html>
